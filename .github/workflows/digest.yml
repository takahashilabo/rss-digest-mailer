name: Send daily digest

on:
  schedule:
    # 08:30 JST == 23:30 UTC (previous day) — 30 min after github-rss-reader's fetch,
    # to give it time to fetch, commit, and rebuild Pages.
    - cron: "30 23 * * *"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると実際のメール送信をスキップし、内容をログに出すだけにする"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Send digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          HATENA_USERNAME: ${{ vars.HATENA_USERNAME }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run digest
