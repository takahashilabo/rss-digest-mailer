name: Send daily digest

on:
  # Paused 2026-11-12: project put on hold (free-tier AI selection didn't clear
  # the bar for the effort/cost involved). The schedule trigger is removed so
  # this cannot fire Gemini/send mail on its own; workflow_dispatch is kept
  # only so it can still be run by hand if revisited.
  workflow_dispatch:
    inputs:
      dry_run:
        description: "true にすると実際のメール送信をスキップし、内容をログに出すだけにする"
        type: boolean
        default: false

jobs:
  digest:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm install

      - name: Send digest
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
          GMAIL_USER: ${{ secrets.GMAIL_USER }}
          GMAIL_APP_PASSWORD: ${{ secrets.GMAIL_APP_PASSWORD }}
          RECIPIENT_EMAIL: ${{ secrets.RECIPIENT_EMAIL }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: npm run digest
